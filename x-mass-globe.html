<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X-Mass Globe</title>
    <link id="globe-model" rel="preload" as="fetch" href="./ChristmasSnowGlobe.glb" crossorigin>
    <style>
      body {
        margin: 0;
        background: #101f22;
        color: #f8f2df;
        font: 1rem/1.5 system-ui, sans-serif;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100svh;
        align-content: end;
        background: radial-gradient(ellipse at 50% 40%, #385655, #101f22 72%);
      }

      #animation-root {
        position: relative;
        height: 58svh;
        min-height: min(14rem, 100svh);
      }

      @media (max-width: 767px) {
        #animation-root {
          height: min(100svh, max(58svh, 140vw));
        }
      }

      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #globe-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1rem;
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      #globe-status.present-status {
        position: fixed;
        inset: auto 0 max(1rem, env(safe-area-inset-bottom));
        z-index: 1;
        pointer-events: none;
      }

      #page-snow {
        position: fixed;
        pointer-events: none;
      }

      #animation-root canvas {
        touch-action: pan-y pinch-zoom;
      }

      #animation-root canvas.finale-canvas {
        position: fixed;
      }

      #animation-root canvas:focus-visible {
        outline: 2px solid #ffe8a0;
        outline-offset: -4px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main aria-label="X-Mass Globe">
      <canvas id="page-snow" aria-hidden="true"></canvas>
      <div id="animation-root">
        <p id="globe-status" role="status">Loading Christmas snow globe…</p>
      </div>
    </main>
    <template id="present-models">
      <object data="./x-mass-presents/box-of-chocolates.glb" data-name="Box of chocolates"></object>
      <object data="./x-mass-presents/champagne-bottle.glb" data-name="Champagne bottle"></object>
      <object data="./x-mass-presents/perfume.glb" data-name="Perfume"></object>
      <object data="./x-mass-presents/scented-candle.glb" data-name="Scented candle"></object>
      <object data="./x-mass-presents/wristwatch-gift-box.glb" data-name="Wristwatch gift box"></object>
    </template>
    <script>
      (() => {
        const CONFIG = {
          // Existing Christmas globe model.
          modelUrl: document.querySelector("#globe-model").href,
          // Vertical camera field of view in degrees.
          fieldOfView: 34,
          // Drawing buffer pixel ratio cap.
          maxDpr: 2,
          // Strength of the reflected softboxes and the glass silhouette.
          glassReflectionStrength: 0.76,
          glassEdgeStrength: 0.64,
          // Snow density for narrow and wide screens.
          mobileSnowCount: 150,
          desktopSnowCount: 260,
          // Ambient snowfall density per 10,000 CSS pixels and upper count.
          pageSnowDensity: 1.2,
          pageSnowLimit: 180,
          // Switch to the higher snow density at this width.
          desktopBreakpoint: 768,
          // Target width of the visible globe on narrow viewports.
          mobileGlobeWidth: 0.90,
          // Vertical space reserved for rocking and edge clearance.
          mobileFramePadding: 0.10,
          // Base fall speed in model units per second.
          fallSpeed: 0.34,
          // Wide-screen rocking angle in radians.
          shakeAngle: 0.17,
          // Horizontal turn in radians per CSS pixel of dragging.
          dragRotationSpeed: 0.012,
          // Minimum pointer travel that separates a drag from a click.
          dragThreshold: 7,
          // Horizontal turn in radians per arrow-key press.
          keyboardRotationStep: Math.PI / 12,
          // Time before the globe returns to its resting position.
          shakeDuration: 1.25,
          // Oscillation frequency in hertz.
          shakeFrequency: 3.6,
          // Initial hop and additional lift on each successive shake.
          presentHop: 0.22,
          presentHopStep: 0.18,
          // Duration of the present drift in seconds.
          presentDriftDuration: 4.8,
          // Portion of the drift spent rising while the globe rocks.
          presentRiseFraction: 0.28,
          // Water response rate and strength of the resulting sideways drift.
          waterResponse: 12,
          waterTravel: 0.19,
          // Keep the presents clear of the glass surface.
          presentGlassClearance: 0.025,
          // Maximum lateral travel and tilt during a hop.
          presentSlide: 0.075,
          presentTilt: 0.48,
          // Radius of the search around each present's original spot.
          presentLandingRange: 0.14,
          // Usable radius of the snow-covered platform.
          presentPlatformRadius: 0.69,
          // Ceiling-reaching shakes required to release a present.
          presentCeilingHits: 3,
          // Finale scale, travel time in seconds and spin in radians per second.
          presentFinalScale: 3,
          presentEscapeDuration: 2.8,
          presentSpinSpeed: 0.52,
          // Let the fully enlarged present spin before it takes over the screen.
          presentShowcaseHold: 3,
          // Duration of the globe exit and the present's move to center.
          presentShowcaseDuration: 1.6,
          // Final projected width as a fraction of the viewport.
          presentShowcaseWidth: 0.50,
          // Seconds for the wrapping to shrink and for the revealed model to grow.
          presentUnwrapDuration: 0.55,
          presentRevealDuration: 0.72,
          // Maximum viewport fractions used to frame the revealed model.
          revealedModelWidth: 0.56,
          revealedModelHeight: 0.76,
          // Colors for the paper confetti.
          confettiColors: ["#ff626d", "#ffd261", "#64e5c1", "#8cc6ff", "#f7a9e2"],
          // Peak acceleration required to trigger, in m/s².
          motionThreshold: 12,
          // Acceleration below which the device counts as quiet, in m/s².
          motionQuietThreshold: 4,
          // Quiet period required before another physical shake, in ms.
          motionQuietTime: 280
        };

        // Resolve browser import-map entries when Vite builds the static page.
        const importFromMap = (specifier) => import(specifier);

        function lightGlass(material, settings) {
          // Keep the dome transparent so it composites over the interior snow.
          material.depthWrite = false;
          material.onBeforeCompile = (shader) => {
            shader.uniforms.glassReflectionStrength = { value: settings.glassReflectionStrength };
            shader.uniforms.glassEdgeStrength = { value: settings.glassEdgeStrength };
            shader.fragmentShader = `
              uniform float glassReflectionStrength;
              uniform float glassEdgeStrength;

              // Evaluate the reflected ray against the width and height of a softbox.
              float softbox(vec3 ray, vec3 center, vec2 sharpness) {
                vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), center));
                vec3 up = cross(center, right);
                vec2 offset = vec2(dot(ray, right), dot(ray, up)) * sharpness;
                return exp(-dot(offset, offset)) * smoothstep(0.0, 0.85, dot(ray, center));
              }
            ` + shader.fragmentShader;

            shader.fragmentShader = shader.fragmentShader.replace("#include <opaque_fragment>", `
              vec3 viewDirection = normalize(vViewPosition);
              vec3 reflected = reflect(-viewDirection, normal);
              float facing = clamp(dot(normal, viewDirection), 0.0, 1.0);
              float fresnel = pow(1.0 - facing, 5.0);
              float edge = glassEdgeStrength * fresnel * (0.68 + 0.32 * abs(normal.x));

              // A warm key panel and a narrower cool fill curve across the dome.
              float keyPanel = softbox(reflected, normalize(vec3(-0.88, 0.44, -0.10)), vec2(5.5, 1.9));
              float keyBloom = softbox(reflected, normalize(vec3(-0.80, 0.48, 0.10)), vec2(2.8, 1.6));
              float fillPanel = softbox(reflected, normalize(vec3(0.94, 0.05, -0.43)), vec2(8.5, 2.5));
              float warm = glassReflectionStrength * (0.51 * keyPanel + 0.13 * keyBloom);
              float cool = glassReflectionStrength * 0.52 * fillPanel;

              float tint = 0.024;
              vec3 glassColor = tint * mix(vec3(0.53, 0.74, 0.76), outgoingLight, 0.30);
              glassColor += warm * vec3(1.0, 0.93, 0.82);
              glassColor += (edge + cool) * vec3(0.64, 0.88, 1.0);
              float cover = tint + warm + cool + edge;

              outgoingLight = glassColor / cover;
              diffuseColor.a = min(cover, 0.88);
              #include <opaque_fragment>
            `);
          };
        }

        function preparePresents(THREE, model, glassBounds, settings) {
          const boxSource = model.getObjectByName("WinterDiorama");
          const ribbonSource = model.getObjectByName("GiftRibbons");
          const boxes = boxSource?.geometry;
          const ribbons = ribbonSource?.geometry;

          // In the supplied GLB, each box has 24 vertices and each matching ribbon set has 112.
          const count = 10;
          const firstBox = 1821;
          const boxSize = 24;
          const ribbonSize = 112;
          if (boxes?.attributes.position.count !== firstBox + count * boxSize
            || ribbons?.attributes.position.count !== count * ribbonSize) return null;

          function prepareGeometry(geometry) {
            const { position, normal } = geometry.attributes;
            position.setUsage(THREE.DynamicDrawUsage);
            normal.setUsage(THREE.DynamicDrawUsage);
            return {
              position,
              normal,
              restPositions: position.array.slice(),
              restNormals: normal.array.slice()
            };
          }

          const boxMesh = prepareGeometry(boxes);
          const ribbonMesh = prepareGeometry(ribbons);
          const meshes = [boxMesh, ribbonMesh];
          const sample = new THREE.Vector3();
          const bounds = new THREE.Box3();
          const turn = new THREE.Quaternion();
          const angles = new THREE.Euler();
          // The glass, boxes and ribbons share the GLB's original mesh coordinates.
          const glassRadius = glassBounds.max.x;
          const centerY = glassBounds.max.y - glassRadius;
          const insideRadius = glassRadius - settings.presentGlassClearance;
          const insideRadiusSquared = insideRadius * insideRadius;
          let hopHeight = settings.presentHop;
          let activeHeight = hopHeight;
          let minimumLift;
          let maximumLift;
          let releasedGift;
          function restPose() {
            return { x: 0, z: 0, lift: 0, tiltX: 0, tiltZ: 0 };
          }

          const presents = Array.from({ length: count }, (_, index) => {
            const first = firstBox + index * boxSize;
            bounds.makeEmpty();
            for (let vertex = first; vertex < first + boxSize; vertex++) {
              bounds.expandByPoint(sample.fromArray(boxMesh.restPositions, vertex * 3));
            }
            const base = bounds.getCenter(new THREE.Vector3());
            base.y = bounds.min.y;

            // The two side axes describe the box footprint even when its baked yaw differs.
            let face = first;
            while (Math.abs(boxMesh.normal.getY(face)) > 0.5) face++;
            const sideX = boxMesh.normal.getX(face);
            const sideZ = boxMesh.normal.getZ(face);
            let halfWidth = 0;
            let halfDepth = 0;
            for (let vertex = first; vertex < first + boxSize; vertex++) {
              sample.fromArray(boxMesh.restPositions, vertex * 3).sub(base);
              halfWidth = Math.max(halfWidth, Math.abs(sample.x * sideX + sample.z * sideZ));
              halfDepth = Math.max(halfDepth, Math.abs(-sample.x * sideZ + sample.z * sideX));
            }
            return {
              base, first, ribbonFirst: index * ribbonSize,
              sideX, sideZ, halfWidth, halfDepth,
              landingX: 0,
              landingZ: 0,
              liftScale: 0.66 + 0.34 * Math.random(),
              pose: restPose(),
              start: restPose()
            };
          });

          function fitsSurface(mesh, start, size, x, z, onPlatform) {
            for (let vertex = start; vertex < start + size; vertex++) {
              sample.fromArray(mesh.restPositions, vertex * 3);
              const radialSquared = (sample.x + x) ** 2 + (sample.z + z) ** 2;
              if (radialSquared + (sample.y - centerY) ** 2 > insideRadiusSquared
                || (onPlatform && radialSquared > settings.presentPlatformRadius ** 2)) return false;
            }
            return true;
          }

          function projectionRadius(gift, axisX, axisZ) {
            return gift.halfWidth * Math.abs(axisX * gift.sideX + axisZ * gift.sideZ)
              + gift.halfDepth * Math.abs(-axisX * gift.sideZ + axisZ * gift.sideX);
          }

          function overlapsLanding(gift, other, x, z) {
            const dx = other.base.x + other.landingX - gift.base.x - x;
            const dz = other.base.z + other.landingZ - gift.base.z - z;
            // An axis that separates the oriented footprints leaves room for both boxes.
            const axes = [[gift.sideX, gift.sideZ], [-gift.sideZ, gift.sideX],
              [other.sideX, other.sideZ], [-other.sideZ, other.sideX]];
            return axes.every(([axisX, axisZ]) => Math.abs(dx * axisX + dz * axisZ)
              < projectionRadius(gift, axisX, axisZ) + projectionRadius(other, axisX, axisZ));
          }

          function chooseLanding(gift, minimumTravel) {
            const innerRadius = Math.hypot(gift.base.x, gift.base.z) - 0.035;
            for (let attempt = 0; attempt < 40; attempt++) {
              const angle = Math.random() * Math.PI * 2;
              const distance = Math.sqrt(Math.random()) * settings.presentLandingRange;
              const x = Math.cos(angle) * distance;
              const z = Math.sin(angle) * distance;
              if (Math.hypot(x - gift.landingX, z - gift.landingZ) < minimumTravel
                || Math.hypot(gift.base.x + x, gift.base.z + z) < innerRadius
                || !fitsSurface(boxMesh, gift.first, boxSize, x, z, true)
                || !fitsSurface(ribbonMesh, gift.ribbonFirst, ribbonSize, x, z, false)
                || presents.some((other) => other !== gift && overlapsLanding(gift, other, x, z))) continue;

              gift.landingX = x;
              gift.landingZ = z;
              return true;
            }
            return false;
          }

          function randomize() {
            activeHeight = hopHeight;
            hopHeight = Math.min(hopHeight + settings.presentHopStep, insideRadius * 2);
            for (const gift of presents) {
              // Retarget from the current pose if another shake interrupts a drift.
              Object.assign(gift.start, gift.pose);
              gift.hasNewLanding = false;
              // Bias travel outward into the open space around the trees.
              const direction = Math.atan2(gift.base.z, gift.base.x) + (Math.random() - 0.5) * 1.8;
              const distance = settings.presentSlide * (0.45 + 0.55 * Math.random());
              gift.slideX = Math.cos(direction) * distance;
              gift.slideZ = Math.sin(direction) * distance;
              gift.tiltX = settings.presentTilt * (2 * Math.random() - 1);
              gift.tiltZ = settings.presentTilt * (2 * Math.random() - 1);
              gift.delay = Math.random() * 0.06;
              gift.duration = 0.88 + Math.random() * 0.06;
            }

            // Try again after neighbors have moved, with smaller steps in crowded areas.
            for (const minimumTravel of [0.035, 0.025, 0.012]) {
              for (const gift of presents) {
                if (!gift.hasNewLanding) gift.hasNewLanding = chooseLanding(gift, minimumTravel);
              }
            }
          }

          function transform(mesh, start, size, base, x, z) {
            for (let index = start; index < start + size; index++) {
              const offset = index * 3;
              sample.fromArray(mesh.restPositions, offset).sub(base).applyQuaternion(turn).add(base);
              sample.x += x;
              sample.z += z;
              const radialSquared = sample.x * sample.x + sample.z * sample.z;
              const glassHalfHeight = Math.sqrt(Math.max(0, insideRadiusSquared - radialSquared));
              minimumLift = Math.max(minimumLift, centerY - glassHalfHeight - sample.y);
              maximumLift = Math.min(maximumLift, centerY + glassHalfHeight - sample.y);
              mesh.position.setXYZ(index, sample.x, sample.y, sample.z);
              sample.fromArray(mesh.restNormals, offset).applyQuaternion(turn);
              mesh.normal.setXYZ(index, sample.x, sample.y, sample.z);
            }
          }

          function applyLift(mesh, start, size, lift) {
            for (let index = start; index < start + size; index++) {
              mesh.position.setY(index, mesh.position.getY(index) + lift);
            }
          }

          function update(progress, waterX = 0, waterZ = 0) {
            let touchedCeiling = false;
            for (const gift of presents) {
              if (gift === releasedGift) continue;
              const t = THREE.MathUtils.clamp((progress - gift.delay) / gift.duration, 0, 1);
              const apex = settings.presentRiseFraction;
              // The shake lifts the gift. Settling through the water takes longer.
              const float = THREE.MathUtils.smoothstep(t, 0, apex)
                * (1 - THREE.MathUtils.smoothstep(t, apex, 1));
              const rock = float * (1 - 2 * t);
              const sway = float * (1 - float) * 4;
              const current = THREE.MathUtils.smoothstep(t, 0, 0.08) * (1 - float) * (1 - t);
              const carry = 1 - THREE.MathUtils.smoothstep(t, 0, 0.15);
              const { pose, start } = gift;
              const landing = THREE.MathUtils.smoothstep(t, apex, 1);
              const driftX = gift.slideX * sway + waterX * current * settings.waterTravel;
              const driftZ = gift.slideZ * sway + waterZ * current * settings.waterTravel;
              pose.x = THREE.MathUtils.lerp(start.x, gift.landingX, landing) + driftX * (1 - carry);
              pose.z = THREE.MathUtils.lerp(start.z, gift.landingZ, landing) + driftZ * (1 - carry);
              pose.tiltX = THREE.MathUtils.lerp(gift.tiltX * rock + waterZ * current, start.tiltX, carry);
              pose.tiltZ = THREE.MathUtils.lerp(gift.tiltZ * rock - waterX * current, start.tiltZ, carry);
              turn.setFromEuler(angles.set(pose.tiltX, 0, pose.tiltZ));

              // Find the vertical space shared by every corner of the box and its bow.
              minimumLift = 0;
              maximumLift = Infinity;
              transform(boxMesh, gift.first, boxSize, gift.base, pose.x, pose.z);
              transform(ribbonMesh, gift.ribbonFirst, ribbonSize, gift.base, pose.x, pose.z);
              const lift = THREE.MathUtils.lerp(activeHeight * gift.liftScale * float, start.lift, carry);
              if (float > 0.65 && lift >= maximumLift) touchedCeiling = true;
              pose.lift = THREE.MathUtils.clamp(lift, minimumLift, maximumLift);
              applyLift(boxMesh, gift.first, boxSize, pose.lift);
              applyLift(ribbonMesh, gift.ribbonFirst, ribbonSize, pose.lift);
            }
            for (const mesh of meshes) {
              mesh.position.needsUpdate = true;
              mesh.normal.needsUpdate = true;
            }
            return touchedCeiling;
          }

          function liftPart(source, start, size) {
            const geometry = new THREE.BufferGeometry();
            for (const [key, attribute] of Object.entries(source.geometry.attributes)) {
              const { array, itemSize, normalized } = attribute;
              geometry.setAttribute(key, new THREE.BufferAttribute(
                array.slice(start * itemSize, (start + size) * itemSize), itemSize, normalized
              ));
            }

            // The box and bow each occupy a contiguous vertex range in the GLB.
            const indices = source.geometry.index.array;
            const selected = [];
            for (let i = 0; i < indices.length; i += 3) {
              if (indices[i] >= start && indices[i] < start + size) {
                selected.push(indices[i] - start, indices[i + 1] - start, indices[i + 2] - start);
              }
            }
            geometry.setIndex(selected);
            const mesh = new THREE.Mesh(geometry, source.material);
            mesh.applyMatrix4(source.matrixWorld);

            const positions = source.geometry.attributes.position;
            for (let i = start; i < start + size; i++) positions.setXYZ(i, 0, 0, 0);
            positions.needsUpdate = true;
            return mesh;
          }

          function release() {
            releasedGift = presents[Math.floor(Math.random() * presents.length)];
            const gift = new THREE.Group();
            gift.add(
              liftPart(boxSource, releasedGift.first, boxSize),
              liftPart(ribbonSource, releasedGift.ribbonFirst, ribbonSize)
            );
            const center = new THREE.Box3().setFromObject(gift).getCenter(new THREE.Vector3());
            for (const part of gift.children) part.position.sub(center);
            gift.position.copy(center);
            return gift;
          }

          return { randomize, update, release };
        }

        async function mountAnimation(container, options) {
          const settings = { ...CONFIG, ...options };
          const status = container.querySelector("#globe-status");
          const pageSnow = document.querySelector("#page-snow");
          const snowContext = pageSnow.getContext("2d");
          const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
          const desktop = matchMedia(`(min-width: ${settings.desktopBreakpoint}px)`);
          const events = new AbortController();
          const { signal } = events;
          const [THREE, { GLTFLoader }] = await Promise.all([
            importFromMap("three"),
            importFromMap("three/addons/loaders/GLTFLoader.js")
          ]);
          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
          });
          renderer.outputColorSpace = THREE.SRGBColorSpace;

          const loader = new GLTFLoader();
          const catalog = [...document.querySelector("#present-models").content.querySelectorAll("object")];
          let model;
          try {
            ({ scene: model } = await loader.loadAsync(settings.modelUrl));
          } catch (error) {
            renderer.dispose();
            throw error;
          }

          const canvas = renderer.domElement;
          canvas.setAttribute("aria-label", "Christmas snow globe with a decorated evergreen and presents");
          container.append(canvas);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(settings.fieldOfView, 1, 0.1, 100);
          scene.add(model, new THREE.HemisphereLight(0xe5f5ff, 0x84736d, 2.1));
          const key = new THREE.DirectionalLight(0xffedcf, 2.9);
          key.position.set(-3, 5, 5);
          const rim = new THREE.DirectionalLight(0xc3eeff, 1.7);
          rim.position.set(3, 3, -4);
          scene.add(key, rim);

          const pivot = model.getObjectByName("ShakePivot");
          const glass = model.getObjectByName("GlassDome");
          const base = model.getObjectByName("LacquerBase");
          model.getObjectByName("Snowflakes").visible = false;
          lightGlass(glass.material, settings);
          glass.renderOrder = 2;

          // The GLB's sphere is centered on ShakePivot and truncated at its base.
          glass.geometry.computeBoundingBox();
          const glassBounds = glass.geometry.boundingBox;
          const presents = preparePresents(THREE, model, glassBounds, settings);
          const radius = glassBounds.max.x - 0.045;
          const floor = glassBounds.min.y + glass.position.y + 0.035;
          const bounds = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
          const raycaster = new THREE.Raycaster();
          const pointer = new THREE.Vector2();
          const hitTargets = [glass, base];
          const hits = [];
          const frameSample = new THREE.Vector3();
          const framePoints = new Float32Array(
            (glass.geometry.attributes.position.count + base.geometry.attributes.position.count) * 3
          );
          let frameOffset = 0;
          // Capture the outer silhouette at rest so dragging and shaking cannot change the fit.
          for (const mesh of hitTargets) {
            const vertices = mesh.geometry.attributes.position;
            for (let index = 0; index < vertices.count; index++) {
              frameSample.fromBufferAttribute(vertices, index).applyMatrix4(mesh.matrixWorld);
              frameSample.toArray(framePoints, frameOffset);
              frameOffset += 3;
            }
          }

          const count = Math.max(settings.mobileSnowCount, settings.desktopSnowCount);
          const positions = new Float32Array(count * 3);
          const fades = new Float32Array(count);
          const flakes = Array.from({ length: count }, () => ({
            x: 0, y: 0, z: 0, top: 0, bottom: 0,
            speed: 0.6 + Math.random() * 0.8
          }));

          function resetFlake(flake, spreadThroughGlobe) {
            const angle = Math.random() * Math.PI * 2;
            const radial = Math.sqrt(Math.random()) * radius * 0.97;
            flake.x = Math.cos(angle) * radial;
            flake.z = Math.sin(angle) * radial;
            flake.top = Math.sqrt(radius * radius - radial * radial);
            flake.bottom = Math.max(floor, -flake.top);
            flake.y = spreadThroughGlobe
              ? THREE.MathUtils.lerp(flake.bottom, flake.top, Math.random())
              : flake.top;
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
          geometry.setAttribute("fade", new THREE.BufferAttribute(fades, 1).setUsage(THREE.DynamicDrawUsage));
          const snowMaterial = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            uniforms: { pixelRatio: { value: 1 }, pointScale: { value: 1 } },
            vertexShader: `
              attribute float fade;
              uniform float pixelRatio;
              uniform float pointScale;
              varying float opacity;

              void main() {
                vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
                gl_Position = projectionMatrix * viewPosition;
                gl_PointSize = clamp(pointScale / -viewPosition.z, 1.0, 5.0) * pixelRatio;
                opacity = fade;
              }
            `,
            fragmentShader: `
              varying float opacity;

              void main() {
                float edge = smoothstep(0.15, 0.5, length(gl_PointCoord - 0.5));
                gl_FragColor = vec4(0.95, 0.99, 1.0, opacity * (1.0 - edge));
              }
            `
          });
          const snow = new THREE.Points(geometry, snowMaterial);
          snow.frustumCulled = false;
          snow.renderOrder = 1;
          pivot.add(snow);
          for (const flake of flakes) resetFlake(flake, true);

          // Snow and confetti share the same canvas and particle seeds.
          const pageFlakes = Array.from({ length: settings.pageSnowLimit }, () => ({
            x: Math.random(),
            phase: Math.random(),
            speed: 14 + Math.random() * 38,
            drift: 8 + Math.random() * 22,
            radius: 0.6 + Math.random() * 1.7,
            opacity: 0.24 + Math.random() * 0.53,
            spin: (0.8 + Math.random() * 2.4) * (Math.random() < 0.5 ? -1 : 1)
          }));
          let pageWidth = 0;
          let pageHeight = 0;
          let pageFlakeCount = 0;

          function drawAtmosphere(time) {
            if (!snowContext) return;
            snowContext.clearRect(0, 0, pageWidth, pageHeight);
            if (reducedMotion.matches || !pageFlakeCount) return;
            const confetti = product?.root.visible;
            const age = confetti ? time - product.revealedAt : time;
            const density = confetti ? 2.4 : 1;
            snowContext.fillStyle = "#f3faff";

            for (let index = 0; index < pageFlakeCount; index++) {
              const flake = pageFlakes[index];
              const track = pageHeight + 24;
              const y = (flake.phase * track + age * flake.speed * density) % track - 12;
              const x = flake.x * pageWidth + flake.drift * density * Math.sin(flake.phase * 12 + age * 0.7);
              if (confetti) {
                snowContext.save();
                snowContext.globalAlpha = 0.48 + flake.opacity * 0.5;
                snowContext.translate(x, y);
                snowContext.rotate(flake.phase * 6 + age * flake.spin);
                snowContext.scale(0.28 + 0.72 * Math.abs(Math.cos(age * flake.spin + index)), 1);
                snowContext.fillStyle = settings.confettiColors[index % settings.confettiColors.length];
                snowContext.fillRect(-flake.radius * 1.3, -flake.radius * 2, flake.radius * 2.6, flake.radius * 4);
                snowContext.restore();
              } else {
                snowContext.globalAlpha = flake.opacity;
                snowContext.beginPath();
                snowContext.arc(x, y, flake.radius, 0, Math.PI * 2);
                snowContext.fill();
              }
            }
          }

          function resizePageSnow(pixelRatio) {
            if (!snowContext) return;
            const width = pageSnow.clientWidth;
            const height = pageSnow.clientHeight;
            const bufferWidth = Math.round(width * pixelRatio);
            const bufferHeight = Math.round(height * pixelRatio);
            if (pageSnow.width !== bufferWidth) pageSnow.width = bufferWidth;
            if (pageSnow.height !== bufferHeight) pageSnow.height = bufferHeight;
            snowContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            pageWidth = width;
            pageHeight = height;
            pageFlakeCount = Math.min(settings.pageSnowLimit, Math.round(width * height * settings.pageSnowDensity / 10000));
            drawAtmosphere(elapsed);
          }

          let paused = false;
          let visible = true;
          let destroyed = false;
          let running = false;
          let lastFrame;
          let resizeFrame;
          let shakeTime = settings.shakeDuration;
          let presentTime = settings.presentDriftDuration;
          let waterX = 0;
          let waterZ = 0;
          let ceilingHits = 0;
          let reachedCeilingThisShake = false;
          let finale;
          let product;
          let productLoading = false;
          const finaleProjection = new THREE.Matrix4();
          const screenProjection = new THREE.Matrix4();
          const departure = new THREE.Vector3();
          const exit = new THREE.Vector3(0, glassBounds.max.y + 0.18, 0);
          const destination = new THREE.Vector3();
          const showcasePosition = new THREE.Vector3();
          const showcaseVertex = new THREE.Vector3();
          const showcaseView = new THREE.Quaternion();
          const showcaseStart = settings.presentEscapeDuration + settings.presentShowcaseHold;
          const showcaseEnd = showcaseStart + settings.presentShowcaseDuration;
          let elapsed = 0;

          function updateSnow(delta, agitation) {
            const activeCount = desktop.matches ? settings.desktopSnowCount : settings.mobileSnowCount;
            geometry.setDrawRange(0, activeCount);
            for (let index = 0; index < activeCount; index++) {
              const flake = flakes[index];
              flake.y -= delta * settings.fallSpeed * flake.speed * (1 + 2.8 * agitation);
              if (flake.y < flake.bottom) resetFlake(flake, false);

              // Agitation adds inertial swirling while the glass rocks around it.
              const swirl = agitation * 0.23 * Math.sin(elapsed * 11 + index * 2.4);
              const angle = swirl + 0.08 * Math.sin(elapsed * 1.2 + index);
              const offset = index * 3;
              positions[offset] = flake.x * Math.cos(angle) - flake.z * Math.sin(angle);
              positions[offset + 1] = flake.y;
              positions[offset + 2] = flake.x * Math.sin(angle) + flake.z * Math.cos(angle);
              fades[index] = 0.85 * Math.min(
                1, (flake.y - flake.bottom) / 0.12, (flake.top - flake.y) / 0.12
              );
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.fade.needsUpdate = true;
          }

          function launchFinale() {
            model.updateWorldMatrix(true, true);
            const gift = presents.release();
            departure.copy(gift.position);
            scene.add(gift);
            const vertices = [];
            for (const part of gift.children) {
              part.updateMatrix();
              const position = part.geometry.attributes.position;
              for (let index = 0; index < position.count; index++) {
                showcaseVertex.fromBufferAttribute(position, index).applyMatrix4(part.matrix);
                vertices.push(showcaseVertex.x, showcaseVertex.y, showcaseVertex.z);
              }
            }
            finale = {
              gift, time: 0, spin: 0, stageRatio: 1, zoom: 1,
              vertices: new Float32Array(vertices),
              viewVertices: new Float32Array(vertices.length)
            };
            canvas.classList.add("finale-canvas");
            shakeTime = settings.shakeDuration;
            pivot.rotation.set(0, 0, 0);
            window.removeEventListener("devicemotion", onMotion);
            resize();
            syncPreference();
          }

          function fitShowcaseGift() {
            const { gift, vertices, viewVertices } = finale;
            camera.getWorldQuaternion(showcaseView).invert().multiply(gift.quaternion);
            let nearest = 0;
            for (let i = 0; i < vertices.length; i += 3) {
              showcaseVertex.fromArray(vertices, i).applyQuaternion(showcaseView);
              showcaseVertex.toArray(viewVertices, i);
              nearest = Math.max(nearest, showcaseVertex.z);
            }

            const depth = -showcaseVertex.copy(exit).applyMatrix4(camera.matrixWorldInverse).z;
            const lens = camera.projectionMatrix.elements;
            let low = 0;
            let high = (depth - camera.near) / nearest;
            let centerX = 0;
            const leftSlope = (lens[8] - settings.presentShowcaseWidth) / lens[0];
            const rightSlope = (lens[8] + settings.presentShowcaseWidth) / lens[0];
            // Fit the actual rotating silhouette between the two screen-width limits.
            for (let step = 0; step < 16; step++) {
              const scale = (low + high) / 2;
              let leftLimit = -Infinity;
              let rightLimit = Infinity;
              for (let i = 0; i < viewVertices.length; i += 3) {
                const z = depth - viewVertices[i + 2] * scale;
                const x = viewVertices[i] * scale;
                leftLimit = Math.max(leftLimit, leftSlope * z - x);
                rightLimit = Math.min(rightLimit, rightSlope * z - x);
              }
              if (leftLimit <= rightLimit) {
                low = scale;
                centerX = (leftLimit + rightLimit) / 2;
              } else {
                high = scale;
              }
            }

            let bottom = Infinity;
            let top = -Infinity;
            for (let i = 0; i < viewVertices.length; i += 3) {
              const z = depth - viewVertices[i + 2] * low;
              const centeredY = lens[9] * z / lens[5] - viewVertices[i + 1] * low;
              bottom = Math.min(bottom, centeredY);
              top = Math.max(top, centeredY);
            }
            // Center the silhouette vertically at its fitted scale.
            for (let step = 0; step < 12; step++) {
              const centerY = (bottom + top) / 2;
              let minY = Infinity;
              let maxY = -Infinity;
              for (let i = 0; i < viewVertices.length; i += 3) {
                const z = depth - viewVertices[i + 2] * low;
                const y = lens[5] * (viewVertices[i + 1] * low + centerY) / z - lens[9];
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
              }
              if (minY + maxY < 0) bottom = centerY;
              else top = centerY;
            }

            showcasePosition.set(centerX, (bottom + top) / 2, -depth).applyMatrix4(camera.matrixWorld);
            return low;
          }

          function moveFinale(delta) {
            finale.time = Math.min(finale.time + delta, showcaseEnd);
            const t = Math.min(1, finale.time / settings.presentEscapeDuration);
            const frame = THREE.MathUtils.smoothstep(t, 0, 0.7);
            const ratio = finale.stageRatio * THREE.MathUtils.lerp(1, finale.zoom, frame);
            // Extend the stage upward and keep the globe anchored to the bottom.
            screenProjection.set(
              1, 0, 0, 0,
              0, ratio, 0, ratio - 1,
              0, 0, 1, 0,
              0, 0, 0, 1
            );
            const zoom = THREE.MathUtils.lerp(1, finale.zoom, frame);
            screenProjection.elements[0] = zoom;
            camera.projectionMatrix.multiplyMatrices(screenProjection, finaleProjection);
            camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

            const gift = finale.gift;
            if (!gift.visible) return;

            const exitTime = 0.45;
            if (t < exitTime) {
              gift.position.lerpVectors(departure, exit, THREE.MathUtils.smoothstep(t, 0, exitTime));
            } else {
              destination.copy(exit).project(camera);
              destination.set(0, 0.65, destination.z).unproject(camera);
              gift.position.lerpVectors(exit, destination, THREE.MathUtils.smoothstep(t, exitTime, 1));
            }

            const reveal = THREE.MathUtils.smoothstep(t, exitTime, 1);
            gift.scale.setScalar(THREE.MathUtils.lerp(1, settings.presentFinalScale, reveal));
            finale.spin = (finale.spin + delta * settings.presentSpinSpeed * reveal) % (2 * Math.PI);
            gift.rotation.set(0.17 * reveal, finale.spin, 0);

            if (finale.time > showcaseStart) {
              const focus = THREE.MathUtils.smoothstep(finale.time, showcaseStart, showcaseEnd);
              const fittedScale = fitShowcaseGift();
              gift.position.lerp(showcasePosition, focus);
              gift.scale.setScalar(THREE.MathUtils.lerp(settings.presentFinalScale, fittedScale, focus));
              model.position.y = -bounds.radius * 5 * focus;
              if (focus === 1 && model.visible) {
                model.visible = false;
                syncCanvasDescription();
              }
            }
          }

          async function unwrapPresent() {
            if (model.visible || product || productLoading || !catalog.length) return;
            productLoading = true;
            const entry = catalog[Math.floor(Math.random() * catalog.length)];
            status.classList.add("present-status");
            status.textContent = "Opening your present…";
            status.hidden = false;

            let asset;
            try {
              ({ scene: asset } = await loader.loadAsync(new URL(entry.getAttribute("data"), document.baseURI).href));
              if (destroyed) {
                disposeModel(asset);
                return;
              }

              const sphere = new THREE.Box3().setFromObject(asset).getBoundingSphere(new THREE.Sphere());
              if (!(sphere.radius > 0)) throw new Error("The present model has empty bounds.");
              const root = new THREE.Group();
              const normalized = new THREE.Group();
              normalized.scale.setScalar(1 / sphere.radius);
              normalized.position.copy(sphere.center).multiplyScalar(-1 / sphere.radius);
              normalized.add(asset);
              root.add(normalized);
              root.visible = false;
              scene.add(root);
              product = { root, hitTargets: [root], name: entry.dataset.name, time: 0, revealedAt: 0 };
              status.hidden = true;
              syncCanvasDescription();

              if (reducedMotion.matches) {
                moveProduct(0);
                renderer.render(scene, camera);
              }
            } catch {
              if (asset) disposeModel(asset);
              if (!destroyed) status.textContent = "The present couldn’t open. Tap or click it to try again.";
            } finally {
              productLoading = false;
            }
          }

          function moveProduct(delta) {
            if (!product) return;
            const unwrap = settings.presentUnwrapDuration;
            const end = unwrap + settings.presentRevealDuration;
            product.time = reducedMotion.matches ? end : Math.min(product.time + delta, end);
            if (product.time < unwrap) {
              const shrink = 1 - THREE.MathUtils.smoothstep(product.time, 0, unwrap);
              finale.gift.scale.multiplyScalar(shrink);
              return;
            }

            if (!product.root.visible) {
              finale.gift.scale.setScalar(0);
              finale.gift.visible = false;
              product.root.visible = true;
              product.revealedAt = elapsed;
              syncCanvasDescription();
            }

            // Keep the entire model in view, including tall bottles and wide boxes.
            destination.copy(exit).project(camera);
            product.root.position.set(0, 0, destination.z).unproject(camera);
            const depth = -showcaseVertex.copy(product.root.position).applyMatrix4(camera.matrixWorldInverse).z;
            const lens = camera.projectionMatrix.elements;
            const halfAngle = Math.atan(Math.min(settings.revealedModelWidth / lens[0],
              settings.revealedModelHeight / lens[5]));
            const growth = THREE.MathUtils.smoothstep(product.time, unwrap, end);
            product.root.scale.setScalar(Math.sin(halfAngle) * depth * growth);
          }

          function render(timestamp) {
            const delta = lastFrame === undefined ? 0 : Math.min((timestamp - lastFrame) / 1000, 0.05);
            lastFrame = timestamp;
            elapsed += delta;
            shakeTime = Math.min(shakeTime + delta, settings.shakeDuration);
            const remaining = 1 - shakeTime / settings.shakeDuration;
            const envelope = remaining * remaining;
            const phase = 2 * Math.PI * settings.shakeFrequency * shakeTime;
            const angle = settings.shakeAngle * (desktop.matches ? 1 : 0.85);
            const rockX = 0.35 * envelope * Math.sin(phase * 0.75);
            const rockZ = envelope * Math.sin(phase);
            pivot.rotation.set(angle * rockX, 0, angle * rockZ);

            // The rocking pushes the water in the opposite direction, with a short lag.
            if (presentTime < settings.presentDriftDuration) {
              waterX = THREE.MathUtils.damp(waterX, -rockZ, settings.waterResponse, delta);
              waterZ = THREE.MathUtils.damp(waterZ, rockX, settings.waterResponse, delta);
              presentTime = Math.min(presentTime + delta, settings.presentDriftDuration);
              const touchedCeiling = presents?.update(presentTime / settings.presentDriftDuration, waterX, waterZ);
              if (!finale && touchedCeiling && !reachedCeilingThisShake) {
                reachedCeilingThisShake = true;
                ceilingHits++;
                if (ceilingHits >= settings.presentCeilingHits) launchFinale();
              }
            }
            if (finale) moveFinale(delta);
            moveProduct(delta);
            drawAtmosphere(elapsed);
            if (model.visible) updateSnow(delta, envelope);
            renderer.render(scene, camera);
          }

          const footprint = new THREE.Box2();
          const framePoint = new THREE.Vector2();
          const projection = new THREE.Matrix4();

          function placeCamera(distance) {
            camera.position.copy(bounds.center).addScaledVector(viewDirection, distance);
            camera.lookAt(target);
            camera.updateMatrixWorld();
          }

          function measureFootprint(distance) {
            placeCamera(distance);
            projection.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            footprint.makeEmpty();
            for (let offset = 0; offset < framePoints.length; offset += 3) {
              frameSample.fromArray(framePoints, offset).applyMatrix4(projection);
              footprint.expandByPoint(framePoint.set(frameSample.x, frameSample.y));
            }
          }

          function fitMobileGlobe(distance, width, height) {
            let near = bounds.radius + camera.near;
            let far = distance;
            const widthLimit = settings.mobileGlobeWidth * 2;
            const heightLimit = (1 - settings.mobileFramePadding) * 2;
            for (let step = 0; step < 14; step++) {
              const mid = (near + far) / 2;
              measureFootprint(mid);
              const fits = footprint.max.x - footprint.min.x <= widthLimit
                && footprint.max.y - footprint.min.y <= heightLimit;
              if (fits) far = mid;
              else near = mid;
            }

            measureFootprint(far);
            const centerX = (footprint.min.x + footprint.max.x) / 2;
            const bottomY = -1 + settings.mobileFramePadding;
            // Use the lens offset to center the silhouette and keep it near the bottom.
            camera.setViewOffset(width, height, centerX * width / 2,
              (bottomY - footprint.min.y) * height / 2, width, height);
          }

          function resize() {
            resizeFrame = undefined;
            const pixelRatio = Math.min(window.devicePixelRatio || 1, settings.maxDpr);
            resizePageSnow(pixelRatio);

            const width = container.clientWidth;
            const height = container.clientHeight;
            if (!width || !height) return;

            camera.aspect = width / height;
            const halfVertical = THREE.MathUtils.degToRad(camera.fov / 2);
            const halfHorizontal = Math.atan(Math.tan(halfVertical) * camera.aspect);
            const distance = (bounds.radius + 0.14) / Math.sin(Math.min(halfVertical, halfHorizontal));
            target.copy(bounds.center);
            target.y += 0.12;
            camera.clearViewOffset();
            if (desktop.matches) placeCamera(distance);
            else fitMobileGlobe(distance, width, height);

            let drawingHeight = height;
            if (finale) {
              drawingHeight = canvas.clientHeight;
              finale.stageRatio = height / drawingHeight;
              finaleProjection.copy(camera.projectionMatrix);
              measureFootprint(camera.position.distanceTo(bounds.center));
              finale.zoom = Math.min(1, 1.28 / ((footprint.max.y + 1) * finale.stageRatio));
              moveFinale(0);
              moveProduct(0);
            }

            renderer.setDrawingBufferSize(width, drawingHeight, pixelRatio);
            snowMaterial.uniforms.pixelRatio.value = pixelRatio;
            snowMaterial.uniforms.pointScale.value = Math.min(width, height) * 0.043;
            if (!running) {
              updateSnow(0, 0);
              renderer.render(scene, camera);
            }
          }

          function scheduleResize() {
            if (resizeFrame === undefined) resizeFrame = requestAnimationFrame(resize);
          }

          function syncPlayback() {
            const shouldRun = !destroyed && !paused && visible && !document.hidden && !reducedMotion.matches;
            if (shouldRun !== running) {
              running = shouldRun;
              lastFrame = undefined;
              renderer.setAnimationLoop(running ? render : null);
            }
          }

          function shake() {
            if (finale || !running || shakeTime < settings.shakeDuration) return;
            reachedCeilingThisShake = false;
            presents?.randomize();
            presentTime = 0;
            shakeTime = 0;
          }

          function hitMeshes(event, targets, recursive = false) {
            const rect = canvas.getBoundingClientRect();
            pointer.set(
              2 * (event.clientX - rect.left) / rect.width - 1,
              1 - 2 * (event.clientY - rect.top) / rect.height
            );
            raycaster.setFromCamera(pointer, camera);
            hits.length = 0;
            raycaster.intersectObjects(targets, recursive, hits);
            const hit = hits.length > 0;
            hits.length = 0;
            return hit;
          }

          let drag;
          let suppressClick = false;

          function rotateGlobe(angle) {
            // Yaw lives on the model root so the shake can rock the child pivot independently.
            model.rotation.y = (model.rotation.y + angle) % (2 * Math.PI);
            if (!running) renderer.render(scene, camera);
          }

          function rotateCurrent(angle) {
            if (product?.root.visible) {
              const root = product.root;
              root.rotation.y = (root.rotation.y + angle) % (2 * Math.PI);
              if (!running) renderer.render(scene, camera);
            } else {
              rotateGlobe(angle);
            }
          }

          function startDrag(event) {
            if (!event.isPrimary || event.button !== 0) return;
            suppressClick = false;
            const onModel = product?.root.visible
              ? hitMeshes(event, product.hitTargets, true)
              : model.visible && hitMeshes(event, hitTargets);
            if (!onModel) return;

            drag = {
              id: event.pointerId,
              startX: event.clientX,
              startY: event.clientY,
              lastX: event.clientX,
              axis: null
            };
          }

          function moveDrag(event) {
            if (drag?.id !== event.pointerId) return;
            if (!drag.axis) {
              const x = Math.abs(event.clientX - drag.startX);
              const y = Math.abs(event.clientY - drag.startY);
              if (Math.max(x, y) < settings.dragThreshold) return;

              suppressClick = true;
              drag.axis = x > y ? "horizontal" : "vertical";
              if (drag.axis === "horizontal") canvas.setPointerCapture(event.pointerId);
            }

            if (drag.axis === "horizontal") {
              rotateCurrent((event.clientX - drag.lastX) * settings.dragRotationSpeed);
              drag.lastX = event.clientX;
            }
          }

          function finishDrag(event) {
            if (drag?.id !== event.pointerId) return;
            if (event.type === "pointercancel") suppressClick = true;
            drag = undefined;
          }

          let armed = true;
          let quietSince;
          let gravityReady = false;
          const gravity = new THREE.Vector3();

          function onMotion(event) {
            if (!running) {
              gravityReady = false;
              armed = true;
              quietSince = undefined;
              return;
            }
            const linear = event.acceleration;
            const hasAxes = (sample) => sample && Number.isFinite(sample.x)
              && Number.isFinite(sample.y) && Number.isFinite(sample.z);
            let magnitude;
            if (hasAxes(linear)) {
              magnitude = Math.hypot(linear.x, linear.y, linear.z);
            } else {
              const raw = event.accelerationIncludingGravity;
              if (!hasAxes(raw)) return;
              if (!gravityReady) {
                gravity.set(raw.x, raw.y, raw.z);
                gravityReady = true;
                return;
              }
              magnitude = Math.hypot(raw.x - gravity.x, raw.y - gravity.y, raw.z - gravity.z);
              const blend = 1 - Math.exp(-(event.interval || 16) / 220);
              gravity.x += (raw.x - gravity.x) * blend;
              gravity.y += (raw.y - gravity.y) * blend;
              gravity.z += (raw.z - gravity.z) * blend;
            }

            const now = performance.now();
            if (magnitude < settings.motionQuietThreshold) {
              quietSince ??= now;
              if (now - quietSince >= settings.motionQuietTime) armed = true;
              return;
            }

            quietSince = undefined;
            if (armed && magnitude >= settings.motionThreshold) {
              armed = false;
              shake();
            }
          }

          function listenForMotion() {
            window.addEventListener("devicemotion", onMotion, { passive: true, signal });
          }

          const motion = window.DeviceMotionEvent;
          const requiresMotionPermission = typeof motion?.requestPermission === "function";
          let permissionRequested = false;

          if (motion && !requiresMotionPermission) listenForMotion();

          async function activateGlobe() {
            if (finale) return;
            shake();
            if (reducedMotion.matches || !requiresMotionPermission || permissionRequested) return;
            permissionRequested = true;
            try {
              const permission = await motion.requestPermission();
              if (!destroyed && !finale && permission === "granted") listenForMotion();
            } catch {
              // Click and keyboard activation stay available without sensor access.
            }
          }

          function setPaused(value) {
            paused = value;
            syncPlayback();
          }

          function syncCanvasDescription() {
            canvas.tabIndex = 0;
            if (!model.visible) {
              if (product?.root.visible) {
                canvas.setAttribute("role", "img");
                canvas.setAttribute("aria-label", product.name);
                canvas.setAttribute("aria-keyshortcuts", "ArrowLeft ArrowRight");
                canvas.setAttribute("aria-description", "Drag horizontally or use the left and right arrow keys to rotate.");
              } else {
                canvas.setAttribute("role", "button");
                canvas.setAttribute("aria-label", "Open Christmas present");
                canvas.setAttribute("aria-keyshortcuts", "Enter Space");
                canvas.removeAttribute("aria-description");
              }
              return;
            }

            const canShake = !finale && !reducedMotion.matches;
            canvas.setAttribute("aria-keyshortcuts", canShake ? "ArrowLeft ArrowRight Enter Space" : "ArrowLeft ArrowRight");
            canvas.setAttribute("aria-description", "Drag horizontally or use the left and right arrow keys to rotate.");
            canvas.setAttribute("role", canShake ? "button" : "img");
            canvas.setAttribute("aria-label", finale ? "Christmas snow globe with a floating present"
              : canShake ? "Shake Christmas snow globe" : "Christmas snow globe");
          }

          function syncPreference() {
            syncCanvasDescription();
            syncPlayback();
            if (reducedMotion.matches) {
              if (presentTime < settings.presentDriftDuration) presents?.update(1);
              presentTime = settings.presentDriftDuration;
              shakeTime = settings.shakeDuration;
              waterX = 0;
              waterZ = 0;
              pivot.rotation.set(0, 0, 0);
              updateSnow(0, 0);
              drawAtmosphere(elapsed);
              if (finale) {
                finale.time = showcaseEnd;
                moveFinale(0);
                moveProduct(0);
              }
              renderer.render(scene, camera);
            }
          }

          const viewDirection = new THREE.Vector3(0.15, 0.12, 1).normalize();
          const target = new THREE.Vector3();
          const sizeObserver = new ResizeObserver(scheduleResize);
          const visibilityObserver = new IntersectionObserver(([entry]) => {
            visible = entry.isIntersecting;
            syncPlayback();
          });
          sizeObserver.observe(container);
          visibilityObserver.observe(container);
          desktop.addEventListener("change", scheduleResize, { signal });
          window.addEventListener("resize", scheduleResize, { signal });
          document.addEventListener("visibilitychange", syncPlayback, { signal });
          reducedMotion.addEventListener("change", syncPreference, { signal });
          canvas.addEventListener("pointerdown", startDrag, { signal });
          canvas.addEventListener("pointermove", moveDrag, { signal });
          canvas.addEventListener("pointerup", finishDrag, { signal });
          canvas.addEventListener("pointercancel", finishDrag, { signal });
          canvas.addEventListener("lostpointercapture", finishDrag, { signal });
          canvas.addEventListener("pointerleave", (event) => {
            if (!canvas.hasPointerCapture(event.pointerId)) finishDrag(event);
          }, { signal });
          canvas.addEventListener("click", (event) => {
            if (suppressClick) return;
            if (!model.visible) {
              if (!product && hitMeshes(event, finale.gift.children)) unwrapPresent();
            } else if (hitMeshes(event, hitTargets)) {
              activateGlobe();
            }
          }, { signal });
          canvas.addEventListener("keydown", (event) => {
            if ((model.visible || product?.root.visible) && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
              event.preventDefault();
              const direction = event.key === "ArrowRight" ? 1 : -1;
              rotateCurrent(direction * settings.keyboardRotationStep);
              return;
            }

            if (event.key !== "Enter" && event.key !== " ") return;
            if ((!model.visible && product) || (model.visible && reducedMotion.matches)) return;

            event.preventDefault();
            if (event.repeat) return;
            if (!model.visible) unwrapPresent();
            else activateGlobe();
          }, { signal });

          resize();
          status.hidden = true;
          syncPreference();

          function disposeModel(root) {
            root.traverse((node) => {
              node.geometry?.dispose();
              if (!node.material) return;
              for (const material of [node.material].flat()) {
                for (const value of Object.values(material)) {
                  if (value?.isTexture) value.dispose();
                }
                material.dispose();
              }
            });
          }

          function destroy() {
            if (destroyed) return;
            destroyed = true;
            syncPlayback();
            events.abort();
            sizeObserver.disconnect();
            visibilityObserver.disconnect();
            cancelAnimationFrame(resizeFrame);
            disposeModel(model);
            if (product) disposeModel(product.root);
            if (finale) {
              for (const part of finale.gift.children) part.geometry.dispose();
            }
            renderer.dispose();
            canvas.remove();
            snowContext?.clearRect(0, 0, pageWidth, pageHeight);
            status.hidden = false;
          }

          return {
            play: () => setPaused(false),
            pause: () => setPaused(true),
            destroy
          };
        }

        const container = document.querySelector("#animation-root");
        mountAnimation(container).then((animation) => {
          window.addEventListener("pagehide", (event) => {
            if (!event.persisted) animation.destroy();
          });
        }).catch(() => {
          container.querySelector("#globe-status").textContent = "The Christmas snow globe could not load.";
        });
      })();
    </script>
  </body>
</html>
